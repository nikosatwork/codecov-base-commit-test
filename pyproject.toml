[project]
name = "codecov-base-commit-repro"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
relative_files = true

[tool.coverage.xml]
output = "coverage.xml"
